name: Lab result fidelity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.15'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and schema verification tools
        run: python -m pip install "build>=1.2,<2" "jsonschema>=4.18,<5"
      - name: Build the source archive with portable headers and build its wheel
        run: python -m build --outdir dist
      - name: Run the sdist tests and verify the clean installation
        run: python scripts/verify_distribution.py dist
